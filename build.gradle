plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

remapJar {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}+mc${project.minecraft_version}.jar"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}

def minecraftVersions = ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']

def yarnMappings = [
        '1.21': '1.21+build.9',
        '1.21.1': '1.21.1+build.3',
        '1.21.2': '1.21.2+build.1',
        '1.21.3': '1.21.3+build.2',
        '1.21.4': '1.21.4+build.8',
        '1.21.5': '1.21.5+build.1',
        '1.21.6': '1.21.6+build.1',
        '1.21.7': '1.21.7+build.8',
        '1.21.8': '1.21.8+build.1',
        '1.21.9': '1.21.9+build.1',
        '1.21.10': '1.21.10+build.2',
        '1.21.11': '1.21.11+build.4'
]

minecraftVersions.each { mcVersion ->
    task "buildFor${mcVersion.replace('.', '')}"(type: GradleBuild) {
        tasks = ['build']
        startParameter.projectProperties = [
                'minecraft_version': mcVersion,
                'yarn_mappings': yarnMappings[mcVersion],
                'archives_base_name': project.archives_base_name,
                'mod_version': project.mod_version
        ]
    }
}
