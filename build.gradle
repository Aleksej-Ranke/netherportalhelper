plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

jar {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}+mc${project.minecraft_version}.jar"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}

tasks.register('regressionTest', JavaExec) {
    group = 'verification'
    description = 'Checks portal coordinate conversion at negative and positive boundaries.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.alek.netherportalhelper.util.PortalTrackerRegressionCheck'
    enableAssertions = true
    dependsOn tasks.testClasses
}

tasks.register('bookmarkRegressionTest', JavaExec) {
    group = 'verification'
    description = 'Checks bookmark scoping, persistence, validation, and safe file handling.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.alek.netherportalhelper.util.BookmarkStoreRegressionCheck'
    enableAssertions = true
    dependsOn tasks.testClasses
}

tasks.named('check') {
    dependsOn tasks.regressionTest, tasks.bookmarkRegressionTest
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}
